# CodeRabbit = the PR reviewer (gate G2). Rules come from AGENTS.md and the ADRs.
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: true          # Claude opens drafts; review them before the owner marks ready
    base_branches: [main]
  path_instructions:
    - path: "packages/event-schemas/**"
      instructions: >-
        Every event type needs an explicit version, valid and invalid fixtures and a contract test.
        A changed schema must be a new version plus an upcaster, never an edit of an existing version.
    - path: "packages/event-store/**"
      instructions: >-
        Events are append-only. Flag any UPDATE/DELETE on events. Check idempotency on event_id and
        that appends are serialized (ADR-003) so global position is never visible out of order.
    - path: "apps/projector/**"
      instructions: >-
        Handlers must be pure and idempotent. Each projection needs a replay test (rebuild == incremental).
        Session ordering uses seq, not occurred_at (ADR-007).
    - path: "apps/collector/**"
      instructions: >-
        Validate all input with zod, truncate IPs, respect consent, verify HMAC on server endpoints.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/adr/*.md"
