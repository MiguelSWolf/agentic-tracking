# Claude works one Linear issue. Two phases, so the plan gate (G1) is enforced by CI, not by trust.
#   phase=plan       → Claude writes a plan, the workflow posts it on the Linear issue, nothing else changes
#   phase=implement  → only runs if the issue has `plan:approved`; Claude's branch becomes a PR ready for review (G2)
# M0 trigger: manual (Actions → agent-implement → Run workflow). M1: Linear webhook → n8n → repository_dispatch.

name: agent-implement

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: Linear issue (e.g. TRK-5)
        required: true
      phase:
        description: plan or implement
        required: true
        default: plan
        type: choice
        options: [plan, implement]
      model:
        description: Model override (default — plan opus, implement sonnet)
        required: false
        default: default
        type: choice
        options: [default, claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
  repository_dispatch:
    types: [agent-implement]

concurrency:
  group: agent-${{ github.event.inputs.issue_id || github.event.client_payload.issue_id }}
  cancel-in-progress: false

permissions:
  actions: write          # dispatch ci.yml on the agent branch
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  ISSUE_ID: ${{ github.event.inputs.issue_id || github.event.client_payload.issue_id }}
  PHASE: ${{ github.event.inputs.phase || github.event.client_payload.phase }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
  # Opus reasons about the plan (G1); Sonnet executes an approved plan. Override per run if needed.
  MODEL_OVERRIDE: ${{ github.event.inputs.model || github.event.client_payload.model || 'default' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tracking, POSTGRES_PASSWORD: tracking, POSTGRES_DB: tracking }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracking" --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }

      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }

      # pnpm must exist even before the monorepo does (TRK-5 creates package.json).
      # With package.json, the version comes from its `packageManager` field.
      - uses: pnpm/action-setup@v5
        if: hashFiles('package.json') != ''
      - uses: pnpm/action-setup@v5
        if: hashFiles('package.json') == ''
        with: { version: 10 }

      - name: Install deps
        if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile

      - name: Gate G1 — implement requires plan:approved
        if: env.PHASE == 'implement'
        run: node scripts/linear.mjs require-label "$ISSUE_ID" plan:approved

      - name: Fetch issue context (Linear → markdown)
        run: |
          mkdir -p .agent-out
          node scripts/linear.mjs get "$ISSUE_ID" .agent-out/issue.md

      - name: Retro inputs (issues labelled type:retro only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/linear.mjs require-label "$ISSUE_ID" type:retro > /dev/null 2>&1; then
            node scripts/agent-metrics.mjs > .agent-out/metrics.md 2> .agent-out/metrics.err || cp .agent-out/metrics.err .agent-out/metrics.md
            node scripts/linear.mjs retro-export "$ISSUE_ID" .agent-out/retro-inputs.md
            # Review comments and @claude requests on merged agent PRs (recurring corrections).
            for n in $(gh pr list --state merged --limit 200 --json number,headRefName \
                --jq '.[] | select(.headRefName | startswith("agent/")) | .number'); do
              echo "## PR #$n"
              gh api "repos/${{ github.repository }}/pulls/$n/comments" \
                --jq '.[] | "- [\(.user.login)] \(.path): \(.body | gsub("\n"; " ") | .[0:500])"'
              gh api "repos/${{ github.repository }}/issues/$n/comments" \
                --jq '.[] | select(.body | contains("@claude")) | "- [\(.user.login)] request: \(.body | gsub("\n"; " ") | .[0:500])"'
            done > .agent-out/reviews.md || true
          fi

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: postgres://tracking:tracking@localhost:5432/tracking
          MONGO_URL: mongodb://localhost:27017/tracking
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the `issue-flow` skill. PHASE=${{ env.PHASE }}.
            The Linear issue (with all comments, including any plan feedback) is in `.agent-out/issue.md`.
            Repository rules are in AGENTS.md. Never touch protected zones.
            If `.agent-out/retro-inputs.md` exists, this is a milestone retro: also use the `retro` skill (inputs: `.agent-out/retro-inputs.md`, `.agent-out/metrics.md`, `.agent-out/reviews.md`).
            ${{ env.PHASE == 'plan' && 'Write only `.agent-out/plan.md`. Do not modify any other file. Do not commit.' || 'The plan was approved by the owner. Implement it and commit on branch `agent/trk-<n>-<slug>`. Do NOT push and do NOT open the PR: the workflow does both after you finish. Write the PR body to `.agent-out/pr.md` and a one-line Conventional Commits PR title to `.agent-out/pr-title.txt`.' }}
            Run one command per Bash call. Avoid pipes, `&&` chains and redirections into protected paths.
          claude_args: >-
            --model ${{ env.MODEL_OVERRIDE != 'default' && env.MODEL_OVERRIDE || (env.PHASE == 'plan' && 'claude-opus-5-5' || 'claude-sonnet-5-5') }}
            --max-turns ${{ env.PHASE == 'plan' && '40' || '60' }}
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(pnpm:*),Bash(git:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(wc:*),Bash(mkdir:*),Bash(echo:*),WebFetch(domain:google.github.io),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:diataxis.fr),WebFetch(domain:www.rfc-editor.org),WebFetch(domain:www.postgresql.org),WebFetch(domain:martinfowler.com),WebFetch(domain:learn.microsoft.com),WebFetch(domain:www.mongodb.com)"
            --disallowedTools "Edit(.github/**),Write(.github/**),Edit(.agents/**),Write(.agents/**),Edit(.claude/**),Write(.claude/**),Edit(AGENTS.md),Write(AGENTS.md),Edit(CLAUDE.md),Write(CLAUDE.md),Edit(docs/adr/**),Write(docs/adr/**),Edit(**/migrations/**),Write(**/migrations/**),Edit(scripts/linear.mjs),Write(scripts/linear.mjs),Edit(scripts/linear-lib.mjs),Write(scripts/linear-lib.mjs),Edit(docs/code-standards/**),Write(docs/code-standards/**),Bash(git push:*),Bash(gh:*)"

      - name: Post plan to Linear (G1)
        if: env.PHASE == 'plan'
        run: |
          test -s .agent-out/plan.md || { echo "Claude produced no plan"; exit 1; }
          { cat .agent-out/plan.md; printf '\n\n---\n_Plan by Claude (run %s). Add `plan:approved` to proceed, or reply with changes and re-run plan._\n' "${{ github.run_id }}"; } > .agent-out/comment.md
          node scripts/linear.mjs comment "$ISSUE_ID" .agent-out/comment.md

      # The agent never pushes. This deterministic step does, with the workflow's GITHUB_TOKEN.
      # (The Claude App token is revoked when the Claude step ends.) GITHUB_TOKEN pushes and PRs
      # don't trigger workflows, so CI is dispatched explicitly on the branch; checks attach to the commit.
      - name: Push branch and open PR (G2)
        if: env.PHASE == 'implement'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          case "$BRANCH" in agent/*) ;; *) echo "::error::Claude left HEAD on '$BRANCH', expected agent/*"; exit 1;; esac
          test -n "$(git log origin/main..HEAD --oneline)" || { echo "::error::No commits on $BRANCH"; exit 1; }
          test -s .agent-out/pr.md || { echo "::error::Missing .agent-out/pr.md"; exit 1; }
          TITLE=$(head -n1 .agent-out/pr-title.txt 2>/dev/null || true)
          [ -n "$TITLE" ] || TITLE=$(git log -1 --format=%s)
          # Append the Linear issue, approved plan and owner feedback so the PR is self-contained.
          node scripts/linear.mjs pr-context "$ISSUE_ID" .agent-out/pr-context.md
          { cat .agent-out/pr.md; printf '\n\n'; cat .agent-out/pr-context.md; } > .agent-out/pr-final.md
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          PR=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file .agent-out/pr-final.md)
          gh workflow run ci.yml --ref "$BRANCH"
          # CodeRabbit skips PRs authored by bots ("Bot user detected"); request the review explicitly.
          gh pr comment "$PR" --body "@coderabbitai review"
          printf 'PR opened by Claude: %s\n\nNext: owner review → merge (G2).\n' "$PR" > .agent-out/comment.md
          node scripts/linear.mjs comment "$ISSUE_ID" .agent-out/comment.md

      # Debugging: keep Claude's full transcript and tell Linear when a run fails.
      - name: Upload Claude transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v5
        with:
          name: claude-transcript-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14

      - name: Report failure to Linear
        if: failure()
        run: |
          printf 'Agent run failed (%s phase). Logs and Claude transcript: %s/%s/actions/runs/%s\n' \
            "$PHASE" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" > .agent-out/failure.md
          node scripts/linear.mjs comment "$ISSUE_ID" .agent-out/failure.md || true

      - name: Record a finding (docs/workflow/findings.md)
        if: always() && steps.claude.outcome != 'skipped'
        run: |
          mkdir -p .agent-out
          node scripts/run-findings.mjs --workflow agent-implement --target "$ISSUE_ID ($PHASE)" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --job-status "${{ job.status }}" --execution "${{ steps.claude.outputs.execution_file }}" \
            --out .agent-out/finding.md
          if [ -f .agent-out/finding.md ]; then
            node scripts/linear.mjs finding .agent-out/finding.md.title .agent-out/finding.md || true
          fi
