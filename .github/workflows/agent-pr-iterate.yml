# Gate G3: the owner asks Claude for changes on a PR by commenting `@claude <request>`.
# Public repo → anyone can comment, so only the repository owner can trigger the agent (protects quota).

name: agent-pr-iterate

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - uses: pnpm/action-setup@v5
        if: hashFiles('package.json') != ''
      - run: pnpm install --frozen-lockfile
        if: hashFiles('package.json') != ''
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent PRs are opened by github-actions[bot], so the action cannot confirm write access
          # and would deny pnpm. Safe here: only the repository owner can trigger this job (see `if`).
          restrict_untrusted_prs: "false"
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --disallowedTools "Edit(.github/**),Write(.github/**),Edit(.agents/**),Write(.agents/**),Edit(.claude/**),Write(.claude/**),Edit(AGENTS.md),Write(AGENTS.md),Edit(CLAUDE.md),Write(CLAUDE.md),Edit(docs/adr/**),Write(docs/adr/**),Edit(**/migrations/**),Edit(scripts/linear.mjs),Write(scripts/linear.mjs),Edit(scripts/linear-lib.mjs),Write(scripts/linear-lib.mjs),Edit(docs/code-standards/**),Write(docs/code-standards/**),Bash(git push --force:*),Bash(gh pr merge:*),Bash(gh pr ready:*)"

      - name: Record a finding (docs/workflow/findings.md)
        if: always() && steps.claude.outcome != 'skipped'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY || 'TRK' }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agent-out
          node scripts/run-findings.mjs --workflow agent-pr-iterate --target "PR #$PR_NUMBER" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --job-status "${{ job.status }}" --execution "${{ steps.claude.outputs.execution_file }}" \
            --out .agent-out/finding.md
          if [ -f .agent-out/finding.md ]; then
            # Only a closing reference (Fixes/Closes/Resolves TRK-n) places the finding in a milestone (TRK-28).
            ISSUE=$(gh pr view "$PR_NUMBER" --json body --jq .body | node scripts/linear.mjs closing-issue || true)
            node scripts/linear.mjs finding .agent-out/finding.md.title .agent-out/finding.md $ISSUE || true
          fi
